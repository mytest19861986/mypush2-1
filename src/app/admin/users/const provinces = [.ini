const provinces = [
  { name: 'تهران', cities: ['تهران', 'شهریار', 'اسلامشهر'] },
  { name: 'گیلان', cities: ['رشت', 'لاهیجان', 'انزلی'] },
  // ...
]
const [selectedProvince, setSelectedProvince] = useState('')
const [selectedCity, setSelectedCity] = useState('')

<select onChange={e => setSelectedProvince(e.target.value)}>
  <option value="">انتخاب استان</option>
  {provinces.map(p => <option key={p.name} value={p.name}>{p.name}</option>)}
</select>
<select onChange={e => setSelectedCity(e.target.value)} disabled={!selectedProvince}>
  <option value="">انتخاب شهر</option>
  {provinces.find(p => p.name === selectedProvince)?.cities.map(city =>
    <option key={city} value={city}>{city}</option>
  )}
</select>